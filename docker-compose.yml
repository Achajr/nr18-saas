services:
  postgres:
    image: postgres:16-alpine
    container_name: nr18-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nr18_saas
      POSTGRES_USER: nr18_user
      POSTGRES_PASSWORD: nr18_password
    ports:
      - "5432:5432"
    volumes:
      - nr18_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nr18_user -d nr18_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nr18_postgres_data:
